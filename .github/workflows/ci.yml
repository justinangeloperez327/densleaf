name: CI

on:
  push:
    branches: [main, "foundation/**"]
  pull_request:

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Check reference application
        run: cargo run -p densleaf-cli -- check examples/hello/app.dl
      - name: Generate reference application
        run: cargo run -p densleaf-cli -- build examples/hello/app.dl
      - name: Compile generated Rust
        run: rustc --edition 2024 --crate-type lib .densleaf/generated/app.rs -o /tmp/libdensleaf_generated.rlib
